<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — a top-down crime story on a neon beach</title>
<meta name="description" content="Neon Bay: an original top-down open-world game. Steal cars, dodge the law, run four story missions in a procedural neon beach city.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120a24'/%3E%3Ccircle cx='32' cy='26' r='11' fill='%23ffb703'/%3E%3Cpath d='M8 46c8-6 16 2 24-2s16 2 24-2v10c-8 4-16-2-24 2s-16-2-24 2z' fill='%2322d3ee'/%3E%3Cpath d='M32 40v10M32 40c-4-6-10-7-14-5M32 40c4-6 10-7 14-5' stroke='%23ff2e88' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b0714; min-height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 10px; padding: 14px;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #b9b3c9;
  }
  canvas#game {
    width: min(100%, calc((100vh - 90px) * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #120a24;
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-radius: 10px;
    box-shadow: 0 0 34px rgba(255, 46, 136, 0.28), 0 0 90px rgba(34, 211, 238, 0.14);
    cursor: crosshair;
  }
  p.hint { margin: 0; font-size: 14px; letter-spacing: 0.02em; text-align: center; }
  p.hint b { color: #f5f2ea; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<p class="hint"><b>Neon Bay</b> — WASD to move &amp; drive · mouse to aim · click to fight · <b>E</b> enter/exit car · <b>P</b> pause · <b>M</b> mute</p>
<noscript><p class="hint">Neon Bay needs JavaScript — it is a small game written in plain ES modules.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
